name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Якщо в репозиторій завантажено архів antcolony-mod-1.21.1.zip — розпаковуємо його.
      # Якщо файли проєкту лежать у корені репозиторію — збираємо їх напряму.
      - name: Find or unpack the project
        run: |
          set -e
          if [ -f dynasty-mod-neoforge-1.21.1.zip ]; then
            rm -rf _project
            mkdir _project
            unzip -q -o dynasty-mod-neoforge-1.21.1.zip -d _project
          fi
          GRADLE_FILE=$(find . -maxdepth 4 -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "build.gradle not found. Upload dynasty-mod-neoforge-1.21.1.zip or the project files to the repository root."
            exit 1
          fi
          PROJ=$(dirname "$GRADLE_FILE")
          echo "Project directory: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build with Gradle
        run: |
          cd "$PROJ"
          gradle build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: antcolony-mod
          path: ${{ env.PROJ }}/build/libs/*.jar
          if-no-files-found: error
